[build-system]
requires = ["setuptools>=65", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-assistant"
version = "0.1.0"
description = "Fully-local AI assistant for HERMES 2022 project management"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Project Lead", email = "user@example.com"}]
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0",
    # Pinned: Chroma's on-disk schema & PersistentClient API are stable within
    # 1.x. A 2.0 bump may change the wrapper contract (see rag/store.py).
    "chromadb>=1.5.0,<2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "icalendar>=5.1.0",
    "workalendar>=16.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
tui = ["textual>=0.47,<1.0"]
webapp = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "types-pyyaml>=6.0",
    "types-requests>=2.31.0",
    "textual>=0.47,<1.0",
    # FastAPI test client (httpx is the transport layer)
    "fastapi>=0.104.0",
    "httpx>=0.27.0",
]

[project.scripts]
hermes = "hermes_assistant.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line-length handled by formatter
    "UP042",  # keep (str, Enum) — project-wide convention, predates StrEnum adoption
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

# Third-party libs that ship no (or incomplete) type stubs. We type our own
# wrappers around them; their internals are out of scope for our gate.
[[tool.mypy.overrides]]
module = [
    "pypdf.*",
    "docx.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# Chroma DOES ship stubs, but they over-constrain embedding/metadata arg types
# (invariant list vs Sequence) and mark read-back fields Optional. Our thin
# ChromaStore wrapper is the typed contract; treat Chroma itself as opaque.
[[tool.mypy.overrides]]
module = ["chromadb.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Scheduling deps ship no type stubs; our thin wrappers are the typed contracts.
[[tool.mypy.overrides]]
module = ["icalendar.*", "workalendar.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi.*", "starlette.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: requires a live Ollama service (skipped by default offline)",
    "e2e: requires Playwright and a live web server (skipped by default)",
    "sanity: fast smoke tests exercising endpoints/stores with no live services (<60s total)",
]
