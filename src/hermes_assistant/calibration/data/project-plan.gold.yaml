# Human-graded gold set for the `project-plan` rubric (Phase 4, C2).
#
# 12 human-reviewed ProjectPlan deliverables, each graded per criterion by a
# senior reviewer (pass | partial | fail). The calibrator joins these labels to
# recorded critic results (by item_id + criterion_id) and reports judge-human
# agreement (Cohen's kappa) plus per-criterion leniency/severity.
#
# This is DATA: add gold items or new rubrics' gold files here, no code changes.
# criterion_id values must match `rubrics/data/project-plan.v1.yaml`.

