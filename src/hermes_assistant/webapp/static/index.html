<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HERMES Local Assistant — Project Dashboard">
  <title>HERMES Dashboard</title>

  <link rel="stylesheet" href="/static/style.css">

  <style>
    /* Shown until Vue mounts over #app. */
    .boot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      height: 100vh;
      color: var(--c-text-muted);
      font-size: 0.875rem;
    }
  </style>

  <script>
    // Apply the stored theme before first paint so the page never flashes
    // the wrong background. app.js re-applies it on mount.
    (function () {
      try {
        var stored = localStorage.getItem('hermes-theme');
        if (!stored) {
          stored = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', stored);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="boot"><span class="spinner"></span> Loading HERMES Dashboard&hellip;</div>
  </div>

  <!-- Chat assistant widget (Phase 5) — framework-free, mounts itself. -->
  <div id="chat-app"></div>

  <!-- Vue 3 (full build: includes the runtime template compiler the screen
       components need). Vendored locally so the dashboard runs offline. -->
  <script src="/static/vendor/vue.global.prod.js"></script>

  <!-- Load order matters: components.js → screens.js → app.js (which mounts). -->
  <script src="/static/components.js"></script>
  <script src="/static/screens.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
