# Rubric: SaaS MVP Launch Readiness (Day 28)
#
# Used at Checkpoint 5 as the final pre-launch gate.
# A pass with residual risks triggers the risk-acceptance workflow.
rubric_id: saas-mvp-launch-readiness
version: "1"
deliverable_type: LaunchReadinessReport
description: >
  Launch readiness rubric for the SaaS MVP Launch project.
  Checks that all blocking risks are resolved, monitoring is in place, and
  the team is ready for the go-live event and first day of production traffic.

criteria:
  - id: all_blockers_resolved
    dimension: completeness
    text: >
      Every blocker-severity finding from prior reviews is either resolved or
      has an accepted risk record signed off by the project sponsor.
    check_type: binary
    severity_if_failed: blocker
    evidence_required: true

  - id: monitoring_and_alerts_live
    dimension: completeness
    text: >
      Application monitoring (error rate, latency, availability) and
      alerting are live in the production environment before go-live.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: rollback_procedure_tested
    dimension: risk_coverage
    text: >
      The rollback procedure has been tested in staging at least once,
      with a documented maximum recovery time.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: on_call_rota_defined
    dimension: completeness
    text: >
      An on-call rota is defined for the first 72 hours post-launch,
      covering at minimum backend, frontend, and DevOps roles.
    check_type: graded
    severity_if_failed: major
    evidence_required: true

  - id: data_backup_verified
    dimension: risk_coverage
    text: >
      A production data backup was taken and verified (restore tested)
      within 24 hours before go-live.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: launch_communication_plan
    dimension: clarity
    text: >
      A communication plan exists for go-live: who is notified, in what
      order, and through which channels (email, Slack, status page).
    check_type: graded
    severity_if_failed: minor
    evidence_required: false

anti_patterns:
  - id: unresolved_blocker_at_launch
    text: >
      A blocker-severity finding from a prior review is listed as 'open' in
      the risk registry at go-live time without a signed acceptance record.
    example_fail: "Risk: Missing encryption — status: open (no owner, no acceptance)"
    example_pass: "Risk: Minor UX gap — status: accepted, signed off by CTO 2026-08-28"
    severity: blocker

  - id: no_monitoring_at_launch
    text: >
      Production environment has no live monitoring or alerting configured
      before the first user traffic arrives.
    example_fail: "We'll set up Datadog next sprint."
    example_pass: "Datadog APM live in prod; PagerDuty alerts configured for error rate > 1%."
    severity: major
