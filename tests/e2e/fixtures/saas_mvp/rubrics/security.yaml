# Rubric: SaaS MVP Security Patch Review (Day 18)
#
# Used at Checkpoint 4 after a CVE zero-day triggers an urgent patch sprint.
# Verifies that the patch plan covers the exploit vector and regression risk.
rubric_id: saas-mvp-security-patch
version: "1"
deliverable_type: SecurityPatchPlan
description: >
  Security patch review rubric for the SaaS MVP Launch project.
  Triggered by CVE zero-day; checks that the patch sprint covers exploit
  remediation, dependency pinning, and post-patch regression testing.

criteria:
  - id: cve_explicitly_referenced
    dimension: completeness
    text: >
      The CVE identifier (e.g. CVE-YYYY-NNNN) is explicitly stated in the
      patch plan so the fix can be traced to the original advisory.
    check_type: binary
    severity_if_failed: blocker
    evidence_required: true

  - id: dependency_pinned_after_patch
    dimension: correctness
    text: >
      The patched dependency version is pinned in the package manifest
      (lock file updated) to prevent regression via automatic updates.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: regression_tests_run_post_patch
    dimension: risk_coverage
    text: >
      The full regression suite is re-run after the patch is applied to
      catch any unexpected breakage from the dependency change.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: exploit_vector_closed
    dimension: correctness
    text: >
      The patch plan documents how the specific exploit vector (e.g. JWT
      signature bypass) is closed, not just that the library is upgraded.
    check_type: binary
    severity_if_failed: blocker
    evidence_required: true

  - id: rollback_plan_documented
    dimension: risk_coverage
    text: >
      A rollback procedure is documented in case the patch introduces a
      production regression during deployment.
    check_type: graded
    severity_if_failed: minor
    evidence_required: false

anti_patterns:
  - id: unpinned_dependency
    text: >
      Patch upgrades the library but does not pin the version, allowing
      future automatic updates to re-introduce the vulnerability or break tests.
    example_fail: "Upgrade auth-lib to latest. (requirements.txt: auth-lib>=2.0)"
    example_pass: "Pin auth-lib==2.1.4 in requirements.txt and regenerate lock file."
    severity: major

  - id: no_regression_after_patch
    text: >
      Security patch is deployed without re-running regression tests,
      risking undetected breakage in auth-adjacent features.
    example_fail: "Patch merged to main. Deploy on Monday."
    example_pass: "Patch merged; CI ran full regression (1247 tests, 0 failures). Deploy approved."
    severity: major
