# Rubric: SaaS MVP Testing Completeness (Day 15)
#
# Used at Checkpoint 3 to review test coverage before the launch phase.
# A fail verdict with blockers/majors triggers suggestions to the plan.
rubric_id: saas-mvp-testing
version: "1"
deliverable_type: TestPlan
description: >
  Testing completeness rubric for the SaaS MVP Launch project.
  Checks that unit, integration, and acceptance tests are defined and
  cover critical user paths before launch approval.

criteria:
  - id: unit_test_coverage_target
    dimension: completeness
    text: >
      A minimum unit-test coverage target (e.g. ≥ 80%) is stated and enforced
      in the CI pipeline. No stated target is a major finding.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: integration_tests_defined
    dimension: completeness
    text: >
      Integration tests cover at minimum: API endpoint contracts, database
      reads/writes, and all third-party integration points.
    check_type: binary
    severity_if_failed: blocker
    evidence_required: true

  - id: uat_scenarios_documented
    dimension: completeness
    text: >
      User Acceptance Testing scenarios are documented and reviewed by a
      product owner or PM before QA sign-off.
    check_type: graded
    severity_if_failed: major
    evidence_required: true

  - id: regression_suite_exists
    dimension: correctness
    text: >
      A regression test suite runs automatically on every pull request merge.
      Manual-only regression is a major risk for a fast-moving MVP.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

  - id: performance_baseline_set
    dimension: correctness
    text: >
      At least one performance baseline test (latency, throughput) is run
      before the load-testing phase to catch regressions.
    check_type: graded
    severity_if_failed: minor
    evidence_required: false

  - id: test_environments_isolated
    dimension: internal_consistency
    text: >
      Test environments (unit, integration, staging) are isolated from
      production. Sharing environments leads to data contamination.
    check_type: binary
    severity_if_failed: major
    evidence_required: true

anti_patterns:
  - id: no_integration_tests
    text: >
      Test plan covers only unit tests; integration between services is
      left to manual testing or production monitoring.
    example_fail: "Testing: unit tests only. Integration to be verified post-launch."
    example_pass: "Contract tests for all 6 API endpoints; DB integration tests in CI."
    severity: blocker

  - id: shared_prod_test_env
    text: >
      Testing is performed in the production environment or using production data.
    example_fail: "UAT will run against the live prod database (read-only)."
    example_pass: "UAT uses a staging DB seeded with anonymised production snapshots."
    severity: major
